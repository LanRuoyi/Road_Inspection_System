road_centering_controller:
  ros__parameters:
    dnn_topic: /hobot_dnn_detection
    road_target_type: road
    mask_threshold: 1
    bottom_ratio: 0.35

    enhance:
      main_track_enabled: true
      morph_open_radius: 1
      morph_close_radius: 1
      min_component_area: 120
      prior_max_distance_px: 120.0

      ransac_enabled: true
      ransac_iterations: 50
      ransac_inlier_threshold_px: 2.5
      ransac_min_inliers: 60

      lowpass_alpha: 0.35
      branch_freeze_s: 0.6
      branch_ambiguity_ratio: 0.65
      branch_center_dist_px: 40.0

    control_rate_hz: 20.0
    vision_timeout_s: 0.25

    pid:
      kp: 0.7
      ki: 0.03
      kd: 0.08
      integral_limit: 1.0
      vy_limit: 1.2
      invert_error_sign: false

    gps:
      use_safety_gate: true
      current_topic: /mavros/global_position/raw/fix
      reference_topic: /road_centering/reference_fix
      max_deviation_m: 8.0
      timeout_s: 1.0

    mavlink:
      serial_enabled: false
      serial_port: /dev/ttyUSB0
      baudrate: 115200
      sys_id: 246
      comp_id: 191
      target_sys_id: 1
      target_comp_id: 1
      body_ned_frame: true

    bridge:
      enabled: true
      command_topic: /uav/mavlink/command
